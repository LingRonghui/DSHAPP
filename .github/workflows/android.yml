name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          validate-wrappers: false
          cache-write-only: true

      - name: Regenerate official Gradle Wrapper 8.9
        run: |
          set -e
          # 无论仓库里 wrapper 状态如何，都用系统 gradle 重新生成官方8.9 wrapper三件套
          which gradle || ( echo "gradle not on PATH, trying setup-gradle provisioned..."; ls -la /usr/bin/gradle* 2>/dev/null || true )
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x ./gradlew
          echo "=== wrapper 校验 ==="
          ls -la gradlew gradle/wrapper/
          ./gradlew --version 2>&1 | head -10 || true

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon assembleDebug --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            --no-build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-outputs
          path: |
            app/build/outputs/**/*.txt
            app/build/outputs/**/*.json
            **/build/reports/**/*
          if-no-files-found: ignore
          retention-days: 14