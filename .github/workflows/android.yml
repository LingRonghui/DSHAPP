name: Android Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DIST: 'temurin'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  GRADLE_VERSION: '8.9'

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            platform-tools

      - name: Setup Gradle ${{ env.GRADLE_VERSION }} (wrapper校验禁用，规避无效hash)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          validate-wrappers: false
          cache-write-only: true
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper/dists

      - name: Build Debug APK
        id: build_debug
        run: |
          echo "=== Gradle 构建开始（直接使用系统Gradle，不依赖wrapper jar）==="
          gradle --no-daemon --offline=false assembleDebug -Pandroid.verbose=true --stacktrace 2>&1 | tail -200
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== 构建结束，exit=$EXIT_CODE ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "⚠ 未找到debug输出目录"
          exit $EXIT_CODE

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload mapping / outputs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-build-outputs
          path: |
            app/build/outputs/**/*.txt
            app/build/outputs/**/*.json
          if-no-files-found: ignore
          retention-days: 14
