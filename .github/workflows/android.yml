name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          set -e
          echo "ANDROID_HOME=\"
          yes | sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>&1 | head -20

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate Gradle Wrapper (if missing)
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper already present, skipping"
            chmod +x gradlew || true
          else
            echo "Generating Gradle wrapper 8.9..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
            chmod +x gradlew || true
            ls -la gradle/wrapper/
          fi

      - name: Build Debug APK
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload outputs logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-outputs
          path: |
            app/build/outputs/**/*.txt
            app/build/outputs/**/*.json
            **/*.log
          if-no-files-found: ignore
          retention-days: 14